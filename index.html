
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Gamer AI - תרגום נקי</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        :root { --p: #00d4ff; --bg: #0b0b0e; --card: #16161a; --success: #2ecc71; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--card); padding: 15px; text-align: center; border-bottom: 2px solid var(--p); font-weight: bold; }
        
        #display { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        
        .card { background: var(--card); border-radius: 20px; border: 1px solid #333; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: pop 0.4s ease; }
        .card img { width: 100%; max-height: 200px; object-fit: contain; background: #000; border-bottom: 1px solid #333; }
        .content { padding: 20px; }
        
        .label { font-size: 12px; color: var(--p); font-weight: bold; margin-bottom: 10px; display: block; letter-spacing: 1px; }
        .final-translation { font-size: 1.2rem; line-height: 1.6; color: #fff; background: rgba(46, 204, 113, 0.1); padding: 15px; border-radius: 12px; border-right: 5px solid var(--success); }
        
        #loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top-color: var(--p); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }

        .nav { background: var(--card); padding: 25px; border-top: 1px solid #333; display: flex; justify-content: center; }
        .btn-cam { background: var(--p); color: black; width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 30px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
        .btn-cam:active { transform: scale(0.9); }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<header>GAMER AI - תרגום חכם לעברית</header>

<div id="loading-overlay">
    <div class="spinner"></div>
    <div>Gemini מנקה את הג'יבריש ומתרגם...</div>
</div>

<div id="display">
    <div style="text-align: center; color: #555; margin-top: 50px;" id="hint">העלה צילום מסך מהמשחק. אני אדאג לכל השאר.</div>
</div>

<div class="nav">
    <input type="file" id="upload" hidden accept="image/*">
    <button class="btn-cam" onclick="document.getElementById('upload').click()">📷</button>
</div>

<script>
    const API_KEY = "AIzaSyBSP9ym_1q8Vde3UFws6fvAuVEVm_nmrks"; 

    document.getElementById('upload').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loading-overlay').style.display = 'flex';
        document.getElementById('hint').style.display = 'none';

        const reader = new FileReader();
        reader.onload = async (ev) => {
            try {
                // 1. סריקה אופטית שקטה
                const worker = await Tesseract.createWorker('eng');
                const { data: { text } } = await worker.recognize(ev.target.result);
                await worker.terminate();

                // 2. תיקון ותרגום חכם דרך Gemini
                const result = await askGemini(text);

                // 3. הצגת תוצאה סופית בלבד
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${ev.target.result}">
                    <div class="content">
                        <span class="label">תרגום לעברית תקינה</span>
                        <div class="final-translation">${result}</div>
                    </div>
                `;
                document.getElementById('display').prepend(card);

            } catch (err) {
                alert("שגיאה בעיבוד. נסה תמונה ברורה יותר.");
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        };
        reader.readAsDataURL(file);
    };

    async function askGemini(rawText) {
        if (!rawText || rawText.length < 5) return "לא הצלחתי לזהות טקסט בתמונה. נסה לצלם מקרוב יותר.";

        // פרומפט חזק יותר לניקוי ג'יבריש
        const prompt = `You are a video game UI translator. I will provide a messy, broken OCR text from a game screenshot. 
        Your task:
        1. Ignore all gibberish symbols like ~, @, |, #, etc.
        2. Identify the core game information (abilities, story, or stats).
        3. Translate it into CLEAN, NATURAL, and ACCURATE Hebrew for a gamer.
        
        Broken Text: ${rawText}`;

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await resp.json();
            return data.candidates[0].content.parts[0].text;
        } catch (e) {
            return "תקלה בחיבור ל-AI. נסה שוב בעוד רגע.";
        }
    }
</script>
</body>
</html>
