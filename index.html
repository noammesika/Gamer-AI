
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gamer AI - Personalized v9.0</title>
    <script src="https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
    <style>
        :root { --p: #00d4ff; --bg: #0b0b0e; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* מסך הגדרות ראשוני */
        #setup-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .setup-card { background: #1a1a1e; padding: 30px; border-radius: 20px; border: 1px solid var(--p); width: 90%; max-width: 400px; }
        .setup-input { background: #25252b; border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; width: 100%; margin: 10px 0; box-sizing: border-box; text-align: center; }
        .gender-box { display: flex; gap: 10px; margin: 20px 0; }
        .gender-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #444; background: #25252b; color: white; cursor: pointer; }
        .gender-btn.active { border-color: var(--p); background: rgba(0, 212, 255, 0.1); }

        header { background: #16161a; padding: 15px; text-align: center; border-bottom: 2px solid var(--p); font-weight: bold; }
        #main-display { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 150px; }
        .bubble { padding: 15px; border-radius: 15px; background: #1c1c21; border-right: 4px solid var(--p); }
        
        .nav { position: fixed; bottom: 0; width: 100%; background: #16161a; border-top: 1px solid #333; padding: 20px; box-sizing: border-box; }
        .btn-row { display: flex; justify-content: space-around; gap: 10px; }
        .circ { background: #333; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: none; }
        .send-btn { background: var(--p); color: black; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="setup-overlay">
    <div class="setup-card">
        <h2 style="color:var(--p)">הגדרות פרופיל</h2>
        <input type="text" id="user-nick" class="setup-input" placeholder="איך לקרוא לך?">
        <div class="gender-box">
            <button class="gender-btn" id="btn-male" onclick="setGender('male')">גבר</button>
            <button class="gender-btn" id="btn-female" onclick="setGender('female')">אישה</button>
        </div>
        <button onclick="finishSetup()" style="background:var(--p); border:none; padding:15px; border-radius:10px; width:100%; font-weight:bold;">המשך לאתר</button>
    </div>
</div>

<header id="site-header">GAMER AI - יוצר האתר</header>

<div id="main-display">
    <div id="welcome-msg" class="bubble"></div>
</div>

<div class="nav">
    <div style="display:flex; gap:10px; margin-bottom:10px;">
        <input type="text" id="cmd-field" class="setup-input" style="margin:0;" placeholder="הקלד הודעה או קוד...">
        <button class="send-btn" onclick="handleInput()">שלח</button>
    </div>
    <div class="btn-row">
        <button class="circ" onclick="alert('פתיחת מצלמה...')">📷</button>
        <button class="circ" onclick="location.href='https://paypal.me/noammesika567'">💰</button>
        <button class="circ" onclick="alert('הגדרות ניהול')">⚙️</button>
    </div>
</div>

<script>
    let userData = { nick: "", gender: "male" };

    function setGender(g) {
        userData.gender = g;
        document.getElementById('btn-male').classList.toggle('active', g === 'male');
        document.getElementById('btn-female').classList.toggle('active', g === 'female');
    }

    function finishSetup() {
        const nick = document.getElementById('user-nick').value.trim();
        if(!nick) return alert("אנא בחר כינוי.");
        userData.nick = nick;
        
        document.getElementById('setup-overlay').style.display = 'none';
        
        // התאמת הפנייה
        const welcome = document.getElementById('welcome-msg');
        if(userData.gender === 'male') {
            welcome.innerText = `ברוך הבא, ${userData.nick}. איך אוכל לעזור לך היום?`;
        } else {
            welcome.innerText = `ברוכה הבאה, ${userData.nick}. איך אוכל לעזור לך היום?`;
        }
    }

    function handleInput() {
        const val = document.getElementById('cmd-field').value.trim();
        if(!val) return;

        // בדיקת קוד מנהל בלי להגיד את השם
        if(val === "Mesika 3112005") {
            alert(userData.gender === 'male' ? "זוהית כמנהל המערכת. שלום לך." : "זוהית כמנהלת המערכת. שלום לך.");
            document.getElementById('site-header').innerText = "ADMIN MODE ACTIVE";
        } else {
            const d = document.createElement('div');
            d.className = 'bubble';
            d.style.marginTop = "10px";
            d.innerText = userData.gender === 'male' ? "הבנתי אותך, אני בודק את זה..." : "הבנתי אותך, אני בודקת את זה...";
            document.getElementById('main-display').appendChild(d);
        }
        document.getElementById('cmd-field').value = "";
    }
</script>
</body>
</html>
