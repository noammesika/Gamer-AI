<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamer AI - Translator Pro</title>
    <script src="https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
    <style>
        :root { --p: #00d4ff; --bg: #0b0b0e; --card: #16161a; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: var(--card); padding: 15px; text-align: center; border-bottom: 2px solid var(--p); font-weight: bold; position: relative; }
        #role-badge { display: none; position: absolute; left: 10px; top: 18px; color: #ff4444; border: 1px solid #ff4444; padding: 2px 5px; border-radius: 4px; font-size: 10px; }

        #container { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        
        .result-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; animation: slideIn 0.3s; }
        .card-img { width: 100%; max-height: 250px; object-fit: contain; background: #000; }
        .card-content { padding: 15px; }
        .lang-label { font-size: 11px; color: var(--p); text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 5px; }
        .text-block { margin-bottom: 15px; line-height: 1.5; font-size: 1.1rem; }
        .translated { color: #2ecc71; border-top: 1px solid #333; padding-top: 10px; }

        .controls { background: var(--card); padding: 20px; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; }
        .btn-main { background: var(--p); color: black; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; border: none; cursor: pointer; box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
        .btn-sub { background: #333; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: none; cursor: pointer; }

        #setup { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .setup-box { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--p); text-align: center; width: 100%; max-width: 350px; }
        input { background: #25252b; border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; width: 100%; margin: 10px 0; outline: none; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="setup">
    <div class="setup-box">
        <h2 style="color:var(--p)">Gamer AI Translator</h2>
        <input type="text" id="nick" placeholder="כינוי...">
        <div style="display:flex; gap:10px; margin: 15px 0;">
            <button onclick="gender='גבר'" style="flex:1; padding:10px; border-radius:10px; border:1px solid #444; background:#25252b; color:white;">גבר</button>
            <button onclick="gender='אישה'" style="flex:1; padding:10px; border-radius:10px; border:1px solid #444; background:#25252b; color:white;">אישה</button>
        </div>
        <button onclick="enter()" style="width:100%; padding:15px; background:var(--p); border-radius:10px; font-weight:bold; border:none;">התחל לסרוק</button>
    </div>
</div>

<header>
    <div id="role-badge">MASTER</div>
    Gamer AI - יוצר האתר
</header>

<div id="container">
    <div class="result-card" style="border-color: var(--p);">
        <div class="card-content">
            <span class="lang-label">System</span>
            <div id="welcome-msg">ברוך הבא. העלה תמונה מהמשחק כדי לתרגם אותה.</div>
        </div>
    </div>
</div>

<div class="controls">
    <input type="text" id="admin-cmd" placeholder="קוד מנהל..." style="width: 80px; font-size: 10px; margin:0;">
    <button class="btn-sub" onclick="document.getElementById('file-in').click()">🖼️</button>
    <button class="btn-main" onclick="document.getElementById('file-in').click()">📷</button>
    <button class="btn-sub" onclick="window.open('https://paypal.me/noammesika567')">💰</button>
    <button class="btn-sub" onclick="checkAdmin()">🔑</button>
</div>

<input type="file" id="file-in" hidden accept="image/*">

<script>
    let gender = 'גבר';
    function enter() {
        const n = document.getElementById('nick').value;
        if(!n) return alert("אנא הזן כינוי");
        document.getElementById('setup').style.display = 'none';
        document.getElementById('welcome-msg').innerText = `שלום ${n}, המערכת מוכנה לתרגום.`;
    }

    function checkAdmin() {
        if(document.getElementById('admin-cmd').value === "Mesika 3112005") {
            document.getElementById('role-badge').style.display = 'block';
            alert("גישת Master הופעלה.");
        }
    }

    document.getElementById('file-in').onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = async (ev) => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `<img src="${ev.target.result}" class="card-img"><div class="card-content"><span class="lang-label">סורק...</span><div class="text-block">מעבד נתונים...</div></div>`;
            document.getElementById('container').prepend(card);

            try {
                // שלב 1: זיהוי טקסט (OCR)
                const { data: { text } } = await Tesseract.recognize(ev.target.result, 'eng');
                
                // שלב 2: תרגום לעברית (API חינמי)
                const translatedText = await translate(text);
                
                card.querySelector('.card-content').innerHTML = `
                    <span class="lang-label">English (Original)</span>
                    <div class="text-block">${text}</div>
                    <span class="lang-label">עברית (תרגום)</span>
                    <div class="text-block translated">${translatedText}</div>
                `;
            } catch (err) {
                card.querySelector('.text-block').innerText = "שגיאה בעיבוד התמונה.";
            }
        };
        reader.readAsDataURL(file);
    };

    async function translate(text) {
        if(!text.trim()) return "לא נמצא טקסט";
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=iw&dt=t&q=${encodeURI(text)}`);
            const data = await res.json();
            return data[0].map(x => x[0]).join(' ');
        } catch { return "התרגום נכשל."; }
    }
</script>
</body>
</html>
