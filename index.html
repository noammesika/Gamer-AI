<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer AI - Powered by Gemini</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        :root { --p: #00d4ff; --bg: #0b0b0e; --card: #16161a; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card); padding: 15px; text-align: center; border-bottom: 2px solid var(--p); font-weight: bold; }
        #display { flex: 1; overflow-y: auto; padding: 15px; max-width: 800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card); border-radius: 15px; border: 1px solid #333; overflow: hidden; }
        .card img { width: 100%; max-height: 200px; object-fit: contain; background: #000; }
        .content { padding: 15px; }
        .label { font-size: 10px; color: var(--p); font-weight: bold; margin-bottom: 5px; display: block; }
        .text { font-size: 1rem; line-height: 1.5; margin-bottom: 10px; }
        .gemini-fix { color: #2ecc71; border-top: 1px solid #333; padding-top: 10px; font-weight: bold; }
        .nav { background: var(--card); padding: 20px; border-top: 1px solid #333; display: flex; justify-content: center; gap: 20px; }
        .btn { background: var(--p); color: black; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

<header>GAMER AI + GEMINI INTELLIGENCE</header>

<div id="display">
    <div class="card" style="border-color: var(--p);">
        <div class="content">
            <span class="label">סטטוס</span>
            <div class="text">Gemini מוכן לניתוח. העלה תמונה לסריקה חכמה.</div>
        </div>
    </div>
</div>

<div class="nav">
    <input type="file" id="upload" hidden accept="image/*">
    <button class="btn" onclick="document.getElementById('upload').click()">📷</button>
</div>

<script>
    const API_KEY = "YOUR_GEMINI_API_KEY"; // הכנס כאן את המפתח שלך

    document.getElementById('upload').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (ev) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${ev.target.result}"><div class="content"><span class="label">OCR</span><div class="text" id="raw">סורק טקסט...</div><span class="label">GEMINI AI</span><div class="text gemini-fix" id="ai">מנתח ומתקן...</div></div>`;
            document.getElementById('display').prepend(card);

            try {
                // 1. סריקה בסיסית
                const { data: { text } } = await Tesseract.recognize(ev.target.result, 'eng');
                card.querySelector('#raw').innerText = text;

                // 2. תיקון ותרגום באמצעות Gemini
                const cleanedText = await askGemini(text);
                card.querySelector('#ai').innerText = cleanedText;

            } catch (err) {
                card.querySelector('#ai').innerText = "שגיאה בחיבור ל-AI.";
            }
        };
        reader.readAsDataURL(file);
    };

    async function askGemini(rawText) {
        const prompt = `You are a professional game translator. Fix the following messy OCR text from a video game and translate it to clean, natural Hebrew. If it's gibberish, ignore the noise and find the meaning. Text: ${rawText}`;
        
        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await resp.json();
            return data.candidates[0].content.parts[0].text;
        } catch (e) {
            return "לא ניתן היה לגשת לבינה המלאכותית.";
        }
    }
</script>
</body>
</html>
