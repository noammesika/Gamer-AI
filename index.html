<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GamerAI Chat</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap');
        body { margin: 0; font-family: 'Assistant', sans-serif; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 1px solid #333; font-weight: bold; color: #00d4ff; }

        /* Chat Area */
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 15px; font-size: 16px; line-height: 1.4; position: relative; }
        .user-msg { align-self: flex-start; background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-end; background: #2c2c2e; border-bottom-left-radius: 2px; border-right: 4px solid #00d4ff; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 5px; }
        
        /* Input Area */
        .input-area { background: #1f1f1f; padding: 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; }
        .icon-btn { background: #333; border: none; color: white; padding: 12px; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .send-btn { background: #00d4ff; color: black; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; flex: 1; }

        /* Camera View */
        #cam-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; flex-direction: column; }
        video { flex: 1; background: black; width: 100%; }
        .cam-controls { padding: 20px; display: flex; justify-content: space-around; background: #121212; }

        .keyword { color: #00d4ff; font-weight: bold; }
        .loading { font-style: italic; color: #aaa; font-size: 13px; }
    </style>
</head>
<body>

<header>GAMER AI CHAT</header>

<div id="chat-window">
    <div class="msg ai-msg">היי נועם! שלח לי צילום מסך של יכולת או צלם אותה, ואני אתרגם לך אותה מיד.</div>
</div>

<div id="cam-overlay">
    <video id="v" autoplay playsinline></video>
    <div class="cam-controls">
        <button class="icon-btn" onclick="closeCam()">✕</button>
        <button class="icon-btn" style="background:#fff; color:#000;" onclick="takePhoto()">📸</button>
    </div>
</div>

<div class="input-area">
    <button class="icon-btn" onclick="openCam()">📷</button>
    <label class="icon-btn">
        🖼️
        <input type="file" id="f" style="display:none" accept="image/*">
    </label>
    <div style="flex:1; color:#555; font-size:14px;">בחר תמונה לתרגום...</div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
    const chat = document.getElementById('chat-window'), v = document.getElementById('v'), f = document.getElementById('f'), c = document.getElementById('c'), ctx = c.getContext('2d');
    let stream = null;

    const gamerDict = { "damage": "נזק", "cooldown": "טעינה", "range": "טווח", "enemies": "אויבים", "deals": "גורם", "health": "חיים", "ultimate": "אולטי" };

    function addMsg(content, isAi = false, isImg = false) {
        const div = document.createElement('div');
        div.className = `msg ${isAi ? 'ai-msg' : 'user-msg'}`;
        if (isImg) {
            const img = document.createElement('img');
            img.src = content;
            div.appendChild(img);
        } else {
            div.innerHTML = content;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    async function openCam() {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        v.srcObject = stream;
        document.getElementById('cam-overlay').style.display = 'flex';
    }

    function closeCam() {
        stream.getTracks().forEach(t => t.stop());
        document.getElementById('cam-overlay').style.display = 'none';
    }

    function takePhoto() {
        c.width = v.videoWidth; c.height = v.videoHeight;
        ctx.drawImage(v, 0, 0);
        const data = c.toDataURL('image/jpeg');
        closeCam();
        processImage(data);
    }

    f.onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => processImage(ev.target.result);
        reader.readAsDataURL(e.target.files[0]);
    };

    async function processImage(src) {
        addMsg(src, false, true);
        const aiMsg = addMsg('<span class="loading">ה-AI מנתח את התמונה...</span>', true);
        
        // שיפור תמונה קליל לפני OCR
        ctx.filter = "contrast(1.5) grayscale(1)";
        const tempImg = new Image();
        tempImg.src = src;
        await new Promise(r => tempImg.onload = r);
        c.width = tempImg.width; c.height = tempImg.height;
        ctx.drawImage(tempImg, 0, 0);

        const { data: { text } } = await Tesseract.recognize(c.toDataURL(), 'eng');
        
        let lines = text.split('\n').filter(l => l.trim().length > 5);
        if (lines.length === 0) {
            aiMsg.innerHTML = "מצטער נועם, לא הצלחתי לקרוא את הטקסט. נסה תמונה ברורה יותר.";
            return;
        }

        let translated = lines.map(l => {
            let t = l.toLowerCase();
            Object.keys(gamerDict).forEach(k => {
                t = t.replace(new RegExp(k, 'gi'), `<span class="keyword">${gamerDict[k]}</span>`);
            });
            return t;
        }).join('<br>');

        aiMsg.innerHTML = `<strong>ניתוח יכולת:</strong><br>${translated}`;
    }
</script>
</body>
</html>
