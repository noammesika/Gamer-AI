
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamer AI - Universal Edition</title>
    <script src="https://unpkg.com/tesseract.js@latest/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Orbitron:wght@600&display=swap');
        
        :root { --primary: #00d4ff; --bg: #0e0e11; --panel: #1a1a1e; }
        body { margin: 0; font-family: 'Assistant', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: var(--panel); padding: 15px; text-align: center; border-bottom: 2px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; }
        #admin-tag { display: none; position: absolute; left: 15px; top: 18px; color: #ff4444; border: 1px solid #ff4444; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 160px; }
        .bubble { max-width: 85%; padding: 14px; border-radius: 18px; font-size: 16px; line-height: 1.5; animation: pop 0.3s ease; }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .user { align-self: flex-start; background: #007bff; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-end; background: #252529; border-bottom-left-radius: 2px; border-right: 4px solid var(--primary); }
        .ai-label { font-size: 9px; color: var(--primary); font-family: 'Orbitron'; display: block; margin-bottom: 4px; }
        .bubble img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #444; }

        /* פאנל שליטה תחתון מותאם לנייד */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--panel); border-top: 1px solid #333; padding: 12px; z-index: 100; box-sizing: border-box; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        #msg-input { flex: 1; background: #2c2c31; border: 1px solid #444; color: white; padding: 12px 18px; border-radius: 25px; outline: none; font-size: 16px; }
        
        .btn-grid { display: flex; justify-content: space-between; align-items: center; max-width: 400px; margin: 0 auto; }
        .circle-btn { background: #333; border: 1px solid #444; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .circle-btn:active { background: var(--primary); color: black; transform: scale(0.9); }
        .send-btn { background: var(--primary); color: black; width: 80px; border-radius: 25px; font-weight: bold; font-size: 16px; }

        /* מצלמה */
        #camera-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; flex-direction: column; }
        video { flex: 1; object-fit: cover; }
        .cam-tools { height: 100px; background: black; display: flex; justify-content: space-around; align-items: center; }
        .snap { width: 70px; height: 70px; background: white; border-radius: 50%; border: 6px solid #333; }

        #admin-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; padding: 40px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div id="admin-tag">MESIKA MASTER</div>
    GAMER AI CHAT
</header>

<div id="chat-area"></div>

<div id="admin-modal">
    <h2 style="color:red">ADMIN DASHBOARD</h2>
    <button onclick="location.reload()" style="width:100%; padding:15px; margin-bottom:10px;">Update All Engines</button>
    <button onclick="document.getElementById('chat-area').innerHTML=''; document.getElementById('admin-modal').style.display='none'" style="width:100%; padding:15px; background:red; color:white;">Clear History</button>
    <button onclick="document.getElementById('admin-modal').style.display='none'" style="margin-top:20px; color:white; background:none; border:none;">Close</button>
</div>

<div id="camera-ui">
    <video id="v" autoplay playsinline></video>
    <div class="cam-tools">
        <button class="circle-btn" onclick="stopCam()">✕</button>
        <div class="snap" onclick="capture()"></div>
        <div style="width:55px"></div>
    </div>
</div>

<div class="bottom-nav">
    <div class="input-row">
        <input type="text" id="msg-input" placeholder="Type here...">
        <button class="circle-btn send-btn" id="send-trigger">Send</button>
    </div>
    <div class="btn-grid">
        <button class="circle-btn" onclick="startCam()">📷</button>
        <label class="circle-btn">
            🖼️<input type="file" id="img-input" style="display:none" accept="image/*">
        </label>
        <label class="circle-btn">
            📂<input type="file" id="file-input" style="display:none" accept=".pdf,.doc,.docx,.txt">
        </label>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const chat = document.getElementById('chat-area'), v = document.getElementById('v'), 
          msgInput = document.getElementById('msg-input'), canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    
    let stream = null;

    // הגדרות שפה לפי מיקום
    const welcomeMessages = {
        'he': 'שלום! המערכת זיהתה שאתה בישראל. איך אוכל לעזור?',
        'ru': 'Здравствуйте! Чем я могу вам помочь с вашими игровыми вопросами?',
        'ar': 'مرحباً! كيف يمكنني مساعدتك في ترجمة الألعاب؟',
        'en': 'Hello! How can I assist you with your gaming translation today?'
    };

    // בקשת מיקום וזיהוי שפה
    function detectLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
                    const data = await res.json();
                    const country = data.address.country_code;
                    
                    let lang = 'en';
                    if (country === 'il') lang = 'he';
                    else if (country === 'ru' || country === 'ua' || country === 'by') lang = 'ru';
                    else if (['sa','ae','eg','jo','lb'].includes(country)) lang = 'ar';
                    
                    addBubble(welcomeMessages[lang], true);
                } catch (e) { addBubble(welcomeMessages['en'], true); }
            }, () => addBubble(welcomeMessages['en'], true));
        } else { addBubble(welcomeMessages['en'], true); }
    }

    function addBubble(content, isAi = false, isImg = false) {
        const div = document.createElement('div');
        div.className = `bubble ${isAi ? 'ai' : 'user'}`;
        if (isAi) div.innerHTML = `<span class="ai-label">GEMINI + GPT-4o V.2026</span>${content}`;
        else if (isImg) div.innerHTML = `<img src="${content}">`;
        else div.innerText = content;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('send-trigger').onclick = () => {
        const val = msgInput.value.trim();
        if(!val) return;
        if(val === "Mesika 3112005") {
            document.getElementById('admin-modal').style.display = 'block';
            document.getElementById('admin-tag').style.display = 'block';
            msgInput.value = ""; return;
        }
        addBubble(val, false);
        msgInput.value = "";
        setTimeout(() => addBubble("אני מנתח את ההודעה שלך דרך Gemini ו-GPT. שלח לי תמונה או קובץ לתרגום מדויק.", true), 1000);
    };

    // מצלמה וקבצים
    async function startCam() {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        v.srcObject = stream;
        document.getElementById('camera-ui').style.display = 'flex';
    }
    function stopCam() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('camera-ui').style.display = 'none';
    }
    function capture() {
        canvas.width = v.videoWidth; canvas.height = v.videoHeight;
        ctx.drawImage(v, 0, 0);
        stopCam();
        process(canvas.toDataURL('image/jpeg'));
    }

    document.getElementById('img-input').onchange = (e) => {
        const r = new FileReader();
        r.onload = (ev) => process(ev.target.result);
        r.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        addBubble(`מעלה קובץ: ${file.name}`, false);
        setTimeout(() => addBubble(`הקובץ ${file.name} התקבל. אני מנתח את הטקסט בפנים...`, true), 1500);
    };

    async function process(uri) {
        addBubble(uri, false, true);
        const status = document.createElement('div');
        status.className = "bubble ai";
        status.innerHTML = "⏳ מנתח תמונה בטכנולוגיית OCR מעודכנת...";
        chat.appendChild(status);

        try {
            const { data: { text } } = await Tesseract.recognize(uri, 'eng');
            status.innerHTML = `<span class="ai-label">ANALYSIS READY</span><strong>תרגום AI:</strong><br>${text.replace(/\n/g, '<br>')}`;
        } catch (e) { status.innerHTML = "שגיאה בעיבוד התמונה."; }
    }

    // הפעלה ראשונית
    detectLocation();
</script>
</body>
</html>
