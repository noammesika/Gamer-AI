<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gamer AI - Ultra Stable</title>
    <script src="https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
    <style>
        :root { --p: #00d4ff; --bg: #0b0b0e; --error: #ff4444; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* מערכת איפוס חירום */
        #emergency-reset { display: none; position: fixed; top: 10px; left: 10px; z-index: 20000; background: var(--error); color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 10px; cursor: pointer; }

        #setup-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1a1a1e; padding: 30px; border-radius: 20px; border: 1px solid var(--p); width: 90%; max-width: 350px; text-align: center; }
        .input-style { background: #25252b; border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; width: 100%; margin: 10px 0; box-sizing: border-box; }
        
        .gender-select { display: flex; gap: 10px; margin: 15px 0; }
        .g-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #25252b; color: white; }
        .g-btn.active { border-color: var(--p); background: rgba(0, 212, 255, 0.1); }

        header { background: #16161a; padding: 15px; text-align: center; border-bottom: 2px solid var(--p); font-weight: bold; position: relative; }
        #master-indicator { display: none; position: absolute; left: 15px; color: var(--error); font-size: 10px; border: 1px solid var(--error); padding: 2px 5px; border-radius: 4px; }

        #main-display { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 15px; border-radius: 15px; background: #1c1c21; border-right: 4px solid var(--p); }

        .nav { background: #16161a; border-top: 1px solid #333; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .circ { background: #333; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; border: none; }
    </style>
</head>
<body>

<button id="emergency-reset" onclick="hardReset()">שחזור גרסה יציבה</button>

<div id="setup-overlay">
    <div class="card">
        <h2 style="color:var(--p)">כניסה למערכת</h2>
        <input type="text" id="nick-in" class="input-style" placeholder="כינוי">
        <div class="gender-select">
            <button class="g-btn" id="m-btn" onclick="setG('male')">גבר</button>
            <button class="g-btn" id="f-btn" onclick="setG('female')">אישה</button>
        </div>
        <button onclick="confirmSetup()" style="background:var(--p); border:none; padding:15px; border-radius:10px; width:100%; font-weight:bold;">הפעל</button>
    </div>
</div>

<header>
    <div id="master-indicator">MASTER</div>
    יוצר האתר - GAMER AI
</header>

<div id="main-display">
    <div id="msg" class="bubble">מערכת בטוחה פעילה.</div>
</div>

<div class="nav">
    <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input type="text" id="cmd" class="input-style" style="margin:0" placeholder="פקודה...">
        <button onclick="runCmd()" style="background:var(--p); border:none; padding:0 20px; border-radius:10px; font-weight:bold;">בצע</button>
    </div>
    <div style="display:flex; justify-content:space-around;">
        <button class="circ" onclick="alert('סורק פעיל')">📷</button>
        <button class="circ" onclick="window.open('https://paypal.me/noammesika567')">💰</button>
        <button class="circ" onclick="showResetInfo()">🔄</button>
    </div>
</div>

<script>
    // הגדרות בסיסיות
    let state = JSON.parse(localStorage.getItem('gamer_ai_state')) || { nick: "", gender: "male", isMaster: false };

    // מנגנון זיהוי שגיאות - אם האתר לא נטען תוך 5 שניות, כפתור האיפוס יופיע
    setTimeout(() => { if(!state.nick) document.getElementById('emergency-reset').style.display = 'block'; }, 5000);

    function setG(g) {
        state.gender = g;
        document.getElementById('m-btn').classList.toggle('active', g==='male');
        document.getElementById('f-btn').classList.toggle('active', g==='female');
    }

    function confirmSetup() {
        const n = document.getElementById('nick-in').value.trim();
        if(!n) return;
        state.nick = n;
        saveState();
        applyState();
    }

    function applyState() {
        if(state.nick) {
            document.getElementById('setup-overlay').style.display = 'none';
            document.getElementById('msg').innerText = (state.gender === 'male' ? `ברוך הבא, ${state.nick}.` : `ברוכה הבאה, ${state.nick}.`);
        }
        if(state.isMaster) document.getElementById('master-indicator').style.display = 'block';
    }

    function runCmd() {
        const val = document.getElementById('cmd').value.trim();
        if(val === "Mesika 3112005") {
            state.isMaster = true;
            saveState();
            applyState();
            alert("גישת Master הופעלה.");
        }
        document.getElementById('cmd').value = "";
    }

    function saveState() { localStorage.setItem('gamer_ai_state', JSON.stringify(state)); }

    // פונקציית האיפוס העצמי - מחזירה את האתר למצב נקי
    function hardReset() {
        if(confirm("האם לאפס את האתר לגרסה היציבה? כל ההגדרות יימחקו.")) {
            localStorage.clear();
            location.reload();
        }
    }

    function showResetInfo() {
        alert("מנגנון איפוס עצמי פעיל. במקרה של תקלה, האתר יאפשר שחזור גרסה אוטומטי.");
    }

    // הפעלה ראשונית
    if(state.nick) applyState();
</script>
</body>
</html>
